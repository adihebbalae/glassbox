<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bugzoo — delegated listeners</title>
<style>
  body { font-family: sans-serif; color: #111111; background: #ffffff; margin: 16px; }
  button { color: #111111; background: #eeeeee; border: 1px solid #888888; padding: 10px 14px; min-height: 44px; }
  /* the first `button` in the DOM is a hidden mobile hamburger — a bare "button" selector
     lands on THIS one, not on anything the caller cares about (defect D6) */
  #hamburger { display: none; }
</style>
</head>
<body>
<div id="root">
  <button id="hamburger" type="button" aria-label="Menu">=</button>
  <main>
    <h1>Delegated listeners page</h1>
    <button id="delegated" type="button">Delegated only (React-17 shape)</button>
    <button id="direct" type="button">Direct handler</button>
  </main>
</div>
<script>
  // React 17+ attaches every synthetic handler at the ROOT CONTAINER, not on the element:
  // `getEventListeners(button)` is empty even though the button works perfectly.
  document.getElementById('root').addEventListener('click', function (e) {
    if (e.target && e.target.id === 'delegated') document.title = 'delegated-fired';
  });
  document.getElementById('root').addEventListener('keydown', function () { /* delegated too */ });
  // contrast case: a real, direct listener
  document.getElementById('direct').addEventListener('click', function () { document.title = 'direct-fired'; });
</script>
</body>
</html>
